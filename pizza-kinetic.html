<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다시, 주문 수로 · 피자 9개 매장 실적 키네틱 타이포</title>
<meta name="description" content="피자 프랜차이즈 9개 매장 80개월 실적의 시사점 3가지를 담은 30초 키네틱 타이포그래피">
<style>
  html, body { margin: 0; height: 100%; background: #12052a; color: #FFF4E2; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; }
  #view { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  #stage > .scene { position: absolute; inset: 0; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1c0a3c; }
  #bar button { font: inherit; font-size: 14px; color: #FFF4E2; background: #3a1873; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; min-width: 44px; }
  #bar button:hover { background: #4d2295; }
  #bar button:focus-visible { outline: 2px solid #F6C445; outline-offset: 2px; }
  #scrub { flex: 1; accent-color: #F6C445; min-width: 0; }
  #time { font-variant-numeric: tabular-nums; font-size: 14px; opacity: .8; min-width: 92px; text-align: right; }
#stage { --ground:#2B0F57; --main:#7823DC; --second:#FFF4E2; --accent:#F6C445; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground); overflow:hidden }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-size:120px; line-height:1.1; font-weight:800; letter-spacing:-0.03em; text-shadow:0 4px 18px rgba(0,0,0,.35) } .sub { font-size:44px; font-weight:500; line-height:1.35; text-shadow:0 2px 10px rgba(0,0,0,.4) }
#stage { --deep:color-mix(in srgb, var(--ground) 70%, #000); --gridline:color-mix(in srgb, var(--second) 22%, transparent); --ghost:color-mix(in srgb, var(--second) 9%, transparent); --soft:color-mix(in srgb, var(--second) 78%, var(--main)); --lilac:color-mix(in srgb, var(--main) 38%, var(--second)) }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.shade { position:absolute; inset:0; background:linear-gradient(90deg, color-mix(in srgb, var(--deep) 62%, transparent), color-mix(in srgb, var(--deep) 30%, transparent) 70%, color-mix(in srgb, var(--deep) 10%, transparent)), radial-gradient(120% 90% at 40% 45%, transparent 45%, color-mix(in srgb, var(--deep) 80%, transparent)) }
.w { display:inline-block; overflow:hidden; vertical-align:bottom; padding:0.04em 0.02em 0.12em; margin:-0.04em 0 -0.12em } .w > i { display:inline-block; font-style:normal }
.kicker { font-size:30px; font-weight:700; letter-spacing:0.18em; color:var(--accent) }
.num { font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.04em; line-height:1; text-shadow:0 6px 24px rgba(0,0,0,.35) }
.hi { color:var(--accent) } .mint { color:var(--lilac) } .soft { color:var(--soft) }
.bar { position:absolute; height:14px; border-radius:7px; transform-origin:0 50% }
.ghost { position:absolute; font-weight:900; color:var(--ghost); line-height:0.8; letter-spacing:-0.06em; white-space:nowrap }
</style>
</head>
<body>
<div id="view"><div id="stage"></div></div>
<div id="bar">
  <button id="play" type="button" aria-label="재생/일시정지">❚❚</button>
  <button id="sound" type="button" aria-label="소리 켜기">🔇 소리</button>
  <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="재생 위치">
  <span id="time">0.0 / 30.0</span>
</div>
<script>
'use strict';
const CUT = {"v": 1, "stage": "final", "look": "Swirling night canvas: big Korean type and counting figures rise and swap over thick post-impressionist brushstrokes in deep violet that curl round slow eddies, a few yellow strokes; user asked for a Van Gogh-like painting style centred on Kearney purple; plain", "palettes": [["#2B0F57", "#7823DC", "#FFF4E2", "#F6C445"], ["#1B1410", "#F2A541", "#FFF4E6", "#E4572E"], ["#EEF3EA", "#2F6B3A", "#14261A", "#E0662F"], ["#1D3B8A", "#FFD23F", "#FFFFFF", "#7FE0C4"]], "theirs": 1, "width": 1920, "height": 1080, "fps": 60, "background": "#2B0F57", "scenes": [{"id": "open", "name": "80개월의 실적", "dur": 4, "desc": "제목이 한 줄씩 밀려 들어오며 9개 매장, 80개월 실적을 소개한다."}, {"id": "price", "name": "가격이 키운 매출", "dur": 6, "desc": "매출 +16%가 솟아오르고, 주문 -1%가 떨어지며, 객단가 +17%가 그 사이를 설명한다."}, {"id": "app", "name": "자사앱의 착시", "dur": 6.5, "desc": "자사앱 비중이 5.5%에서 31%로 커지지만 배달앱 주문 10.6만 건은 그대로이고 건당 수수료는 36% 오른다."}, {"id": "stores", "name": "벌어지는 매장", "dur": 6.5, "desc": "서면점 이익률은 위로, 충장로점은 아래로 갈라지며 격차의 원인이 운영임을 말한다."}, {"id": "next", "name": "다음 한 수", "dur": 7, "desc": "세 가지 실행 과제가 차례로 쌓이고 엔드 카드로 멈춘다."}]};
const SCENE_SRC = {};
// ---- kit: the helpers the scenes were written against ----
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const base = {
  W: 1920, H: 1080,
  clamp01, clamp: (x, a, b) => Math.max(a, Math.min(b, x)),
  seg: (t, a, b) => clamp01((t - a) / (b - a)),
  lerp: (a, b, p) => a + (b - a) * p,
  eo: (x) => 1 - Math.pow(1 - x, 3),
  ei: (x) => x * x * x,
  eio: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  eob: (x, s) => { s = s || 1.4; const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
  h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; },
};
var kit = Object.assign({}, base);
</script>
<script>
// A painted night field in thick swirling strokes. Every scene sits on it; words do the moving.
const K = {
  clamp01: (x) => Math.max(0, Math.min(1, x)),
  eo: (x) => 1 - Math.pow(1 - x, 3),
  ei: (x) => x * x * x,
  eio: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  eob: (x, s) => { s = s || 1.4; const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
  rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
};
const TONES = [
  'color-mix(in srgb, var(--main) 22%, var(--ground))', 'color-mix(in srgb, var(--main) 34%, var(--ground))',
  'color-mix(in srgb, var(--main) 46%, var(--ground))', 'color-mix(in srgb, var(--main) 60%, var(--ground))',
  'color-mix(in srgb, var(--second) 16%, var(--ground))', 'color-mix(in srgb, var(--ground) 70%, #000)',
  'color-mix(in srgb, var(--accent) 30%, var(--ground))',
];
const SWIRLS = [[1520, 250, 270, 1], [360, 840, 230, -1], [980, 560, 160, 1]];
function flow(x, y) {
  let a = Math.sin(x * 0.0032 + y * 0.0021) * 1.1 + Math.cos(y * 0.0058 - x * 0.0011) * 0.7;
  for (const [cx, cy, R, d] of SWIRLS) {
    const dx = x - cx, dy = y - cy, w = Math.exp(-Math.hypot(dx, dy) / R);
    a = a * (1 - w) + (Math.atan2(dy, dx) + d * Math.PI / 2) * w;
  }
  return a;
}
window.W = {
  // The painted field: strokes follow one flow, curling round three eddies. Same world in every scene, seen from its own seed.
  paper(id) {
    const r = K.rng(31 + id.length * 17 + id.charCodeAt(0));
    let s = '<svg class="art ' + id + '-paper" viewBox="0 0 1920 1080"><rect x="-200" y="-200" width="2320" height="1480" style="fill:var(--ground)"/><g class="' + id + '-strokes" style="fill:none;stroke-linecap:round">';
    for (let gy = -50; gy < 1140; gy += 92) for (let gx = -70; gx < 2000; gx += 100) {
      const x = gx + r() * 70, y = gy + r() * 64, a = flow(x, y), L = 50 + r() * 46, c = Math.cos(a), n = Math.sin(a), b = (r() - 0.5) * 22;
      const pick = r(), tone = TONES[pick < 0.05 ? 6 : pick < 0.13 ? 4 : pick < 0.22 ? 5 : Math.floor(r() * 4)];
      s += '<path d="M' + (x - c * L / 2).toFixed(0) + ' ' + (y - n * L / 2).toFixed(0) + ' Q' + (x - n * b).toFixed(0) + ' ' + (y + c * b).toFixed(0) + ' ' + (x + c * L / 2).toFixed(0) + ' ' + (y + n * L / 2).toFixed(0) + '" style="stroke:' + tone + ';stroke-width:' + (11 + r() * 10).toFixed(1) + '"/>';
    }
    s += '</g>';
    for (const [cx, cy, R, d] of SWIRLS) {
      s += '<g class="swirl" data-d="' + d + '" transform="translate(' + cx + ' ' + cy + ')" style="fill:none;stroke-linecap:round">';
      for (let k = 0; k < 11; k++) {
        const rr = 26 + k * (R - 30) / 11, a0 = r() * 6.28, sp = 1.4 + r() * 1.6, tone = TONES[k % 3 === 0 ? 3 : k % 3 === 1 ? 2 : (r() < 0.3 ? 6 : 1)];
        s += '<path d="M' + (rr * Math.cos(a0)).toFixed(0) + ' ' + (rr * Math.sin(a0)).toFixed(0) + ' A' + rr.toFixed(0) + ' ' + rr.toFixed(0) + ' 0 0 1 ' + (rr * Math.cos(a0 + sp)).toFixed(0) + ' ' + (rr * Math.sin(a0 + sp)).toFixed(0) + '" style="stroke:' + tone + ';stroke-width:' + (12 + r() * 8).toFixed(1) + '"/>';
      }
      s += '</g>';
    }
    return s + '</svg>';
  },
  // Wrap every word of an element in a mask so it can rise out of its own baseline.
  split(el) {
    const words = el.textContent.split(' ');
    el.textContent = '';
    return words.map((w, i) => {
      const box = document.createElement('span'); box.className = 'w';
      const inner = document.createElement('i'); inner.textContent = w;
      box.appendChild(inner); el.appendChild(box);
      if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
      return inner;
    });
  },
  // Words rise from below with a small overshoot, staggered; leave by sliding up.
  rise(list, t, t0, opt) {
    const o = Object.assign({ stagger: 0.11, dur: 0.6, out: null, outDur: 0.45 }, opt || {});
    list.forEach((el, i) => {
      const p = K.clamp01((t - t0 - i * o.stagger) / o.dur);
      let y = (1 - K.eob(p, 1.5)) * 110, r = (1 - K.eo(p)) * 6;
      if (o.out != null) { const q = K.clamp01((t - o.out - i * 0.05) / o.outDur); y -= K.ei(q) * 115; }
      el.style.transform = 'translateY(' + y.toFixed(2) + '%) rotate(' + r.toFixed(2) + 'deg)';
    });
  },
  // A counter: from half-way to its value, eased, in the given format.
  count(el, to, t, t0, dur, fmt) {
    const p = K.eo(K.clamp01((t - t0) / dur));
    el.textContent = fmt(to * (0.5 + 0.5 * p));
  },
  // Slow drift of the painted field; its eddies keep turning, so no frame ever freezes.
  drift(el, t, dx, dy, s0, s1, dur) {
    const p = K.clamp01(t / dur);
    el.style.transform = 'translate(' + (dx * p).toFixed(2) + 'px,' + (dy * p).toFixed(2) + 'px) scale(' + (s0 + (s1 - s0) * K.eio(p)).toFixed(4) + ')';
    if (!el._sw) el._sw = Array.from(el.querySelectorAll('.swirl')).map((g) => [g, g.getAttribute('transform'), +g.getAttribute('data-d')]);
    for (const [g, base, d] of el._sw) g.setAttribute('transform', base + ' rotate(' + (d * t * 9).toFixed(2) + ')');
  },
};
</script>
<script>
SCENE_SRC["open"] = function (kit) {
const { seg, lerp, eo, eio, clamp01 } = kit;
kit.scene('open', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground">' + W.paper('open') +
      '<div class="ghost open-ghost" style="right:-40px;bottom:-60px;font-size:860px">80</div>' +
      '<div class="shade"></div>' +
      '<div class="bar open-rule" style="left:160px;top:300px;width:420px;background:var(--accent)"></div>' +
      '<div class="words open-words" style="left:160px;top:360px;width:1500px">' +
        '<p class="kicker open-kick">피자 프랜차이즈 9개 매장 · 2020–2026</p>' +
        '<h1 class="line open-l1" style="font-size:150px">80개월의 실적이</h1>' +
        '<h1 class="line hi open-l2" style="font-size:150px">말해 준 세 가지</h1>' +
      '</div></div>'));
    const q = (s) => kit.stage.querySelector(s);
    this.ghost = q('.open-ghost'); this.rule = q('.open-rule'); this.wrap = q('.open-words');
    this.kick = W.split(q('.open-kick'));
    this.l1 = W.split(q('.open-l1'));
    this.l2 = W.split(q('.open-l2'));
    this.paper = q('.open-paper');
  },
  render(t) {
    W.drift(this.paper, t, -30, -12, 1.0, 1.03, 4);
    this.ghost.style.transform = 'translateX(' + lerp(60, -40, eio(seg(t, -0.5, 4))) + 'px)';
    this.ghost.style.opacity = 0.6 + 0.4 * eo(seg(t, -0.5, 1.2));
    this.rule.style.transform = 'scaleX(' + eo(seg(t, -0.6, 0.6)).toFixed(3) + ')';
    W.rise(this.kick, t, -0.5, { stagger: 0.04, dur: 0.5, out: 3.3 });
    W.rise(this.l1, t, -0.35, { stagger: 0.13, out: 3.35 });
    W.rise(this.l2, t, 0.35, { stagger: 0.16, out: 3.45 });
    this.wrap.style.transform = 'translateX(' + (-2 * t).toFixed(2) + 'px)';
    this.rule.style.opacity = 1 - clamp01((t - 3.3) / 0.4);
  },
});
};
SCENE_SRC["price"] = function (kit) {
const { seg, lerp, eo, ei, eio, eob, clamp01 } = kit;
kit.scene('price', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground">' + W.paper('price') + '<div class="shade"></div>' +
      '<div class="price-cam" style="position:absolute;inset:0">' +
      '<div class="words" style="left:160px;top:110px"><p class="kicker price-kick">시사점 1 · 1~8월 기준, 2023 → 2026</p></div>' +
      '<div class="words price-a" style="left:160px;top:200px;gap:4px"><p class="sub soft price-la">매출</p><p class="num hi price-na" style="font-size:250px">+16%</p></div>' +
      '<div class="words price-b" style="left:1020px;top:200px;gap:4px"><p class="sub soft price-lb">주문 건수</p><p class="num price-nb" style="font-size:250px">−1%</p></div>' +
      '<div style="position:absolute;left:160px;top:560px;width:760px;height:2px;background:var(--gridline)"></div>' +
      '<div class="bar price-ba" style="left:160px;top:520px;width:640px;background:var(--accent)"></div>' +
      '<div class="bar price-bb" style="left:1020px;top:520px;width:640px;background:var(--second)"></div>' +
      '<div class="price-tick" style="position:absolute;left:800px;top:500px;width:4px;height:54px;background:var(--soft)"></div>' +
      '<div class="price-tick2" style="position:absolute;left:1660px;top:500px;width:4px;height:54px;background:var(--soft)"></div>' +
      '<div class="words" style="left:160px;bottom:130px;width:1600px"><h2 class="line mint price-l" style="font-size:104px">올린 건 가격, 객단가 +17%</h2><p class="sub soft price-s">고객 수는 2023년 이후 제자리입니다</p></div>' +
      '</div></div>'));
    const q = (s) => kit.stage.querySelector(s);
    Object.assign(this, { cam: q('.price-cam'), paper: q('.price-paper'), na: q('.price-na'), nb: q('.price-nb'), ba: q('.price-ba'), bb: q('.price-bb'), b: q('.price-b'), tick: q('.price-tick'), tick2: q('.price-tick2') });
    this.kick = W.split(q('.price-kick'));
    this.la = W.split(q('.price-la')); this.lb = W.split(q('.price-lb'));
    this.line = W.split(q('.price-l')); this.sub = W.split(q('.price-s'));
  },
  render(t) {
    W.drift(this.paper, t, 24, -10, 1.02, 1.05, 6);
    this.cam.style.transform = 'scale(' + lerp(1.0, 1.025, eio(seg(t, 0, 6))) + ')';
    W.rise(this.kick, t, 0, { stagger: 0.03, dur: 0.45 });
    W.rise(this.la, t, 0.15);
    const pa = eob(clamp01((t - 0.25) / 0.7), 1.6);
    this.na.style.transform = 'translateY(' + lerp(120, 0, pa).toFixed(1) + 'px) scale(' + (1 + 0.04 * Math.sin(Math.min(t, 6) * 2.1) * seg(t, 1.2, 1.6)).toFixed(4) + ')';
    this.na.style.opacity = eo(seg(t, 0.25, 0.6));
    W.count(this.na, 16, t, 0.25, 1.1, (v) => '+' + Math.round(v) + '%');
    this.ba.style.transform = 'scaleX(' + (lerp(0, 1.16, eo(seg(t, 0.3, 1.4)))).toFixed(3) + ')';
    this.tick.style.opacity = eo(seg(t, 0.2, 0.6));
    // 주문: 떨어져 내려오는 무게
    W.rise(this.lb, t, 1.4);
    const fall = clamp01((t - 1.55) / 0.55), land = seg(t, 2.1, 2.5);
    const sq = 1 - 0.12 * Math.sin(Math.PI * land);
    this.nb.style.transformOrigin = '0 100%';
    this.nb.style.transform = 'translateY(' + lerp(-260, 0, ei(fall)).toFixed(1) + 'px) scale(' + (2 - sq).toFixed(3) + ',' + sq.toFixed(3) + ')';
    this.nb.style.opacity = eo(seg(t, 1.55, 1.8)) * lerp(1, 0.55, eo(seg(t, 2.6, 3.2)));
    this.bb.style.transform = 'scaleX(' + lerp(0, 0.99, eo(seg(t, 1.7, 2.6))).toFixed(3) + ')';
    this.bb.style.opacity = lerp(1, 0.5, eo(seg(t, 2.6, 3.2)));
    this.tick2.style.opacity = eo(seg(t, 1.6, 2.0));
    W.rise(this.line, t, 3.0, { stagger: 0.14 });
    W.rise(this.sub, t, 3.9, { stagger: 0.08 });
  },
});
};
SCENE_SRC["app"] = function (kit) {
const { seg, lerp, eo, ei, eio, eob, clamp01 } = kit;
kit.scene('app', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground">' + W.paper('app') + '<div class="shade"></div>' +
      '<div class="app-cam" style="position:absolute;inset:0">' +
      '<div class="words" style="left:160px;top:110px"><p class="kicker app-kick">시사점 2 · 주문 채널</p></div>' +
      '<div class="words" style="left:160px;top:190px;gap:4px"><p class="sub soft app-la">자사앱 주문 비중</p><p class="num mint app-na" style="font-size:200px">31%</p></div>' +
      '<div class="app-track" style="position:absolute;left:160px;top:470px;width:760px;height:14px;border-radius:7px;background:var(--gridline)"></div>' +
      '<div class="bar app-fill" style="left:160px;top:470px;width:760px;background:var(--lilac)"></div>' +
      '<div class="words app-b" style="left:1040px;top:190px;gap:4px"><p class="sub soft app-lb">배달앱 주문 (1~8월)</p><p class="num app-nb" style="font-size:170px;padding-top:22px">10.6만 건</p></div>' +
      '<div class="app-frame" style="position:absolute;left:1010px;top:250px;width:790px;height:250px;border:4px solid var(--second);border-radius:14px;opacity:0"></div>' +
      '<div class="app-stamp" style="position:absolute;left:1560px;top:226px;padding:6px 18px;font-size:34px;font-weight:800;background:var(--second);color:var(--ground);border-radius:8px">그대로</div>' +
      '<div class="words" style="left:160px;top:590px;width:1600px"><h2 class="line hi app-l" style="font-size:112px">건당 수수료는 +36%</h2></div>' +
      '<div class="words" style="left:160px;bottom:120px;width:1600px"><p class="sub app-s" style="font-size:50px">자사앱은 배달앱이 아니라 홀·포장 고객을 옮겨 왔습니다</p></div>' +
      '</div></div>'));
    const q = (s) => kit.stage.querySelector(s);

    else { const fs = n === 'chime' ? [1047, 1568, 2093] : [1319, 1976]; fs.forEach((f) => { const o = osc('sine', f); o.connect(g); o.start(at); o.stop(at + 2.5); }); env(g, at, 0.003, v * 0.12, 2.2); stopAt = at + 2.5; }
  }
  nodes.forEach((x) => { if (x.stop) try { x.stop(stopAt); } catch (_) {} });
  return nodes;
}
function stopSound() { scheduled.forEach((ns) => ns.forEach((x) => { try { x.stop ? x.stop() : x.disconnect(); } catch (_) {} })); scheduled = []; }
function startSound(from) {
  stopSound(); if (!soundOn || !playing) return;
  const now = ac.currentTime + 0.05;
  out.gain.cancelScheduledValues(0); out.gain.setValueAtTime(Math.pow(10, MASTER.gain / 20), now);
  out.gain.setValueAtTime(Math.pow(10, MASTER.gain / 20), now + Math.max(0, TOTAL - MASTER.fadeOut - from));
  out.gain.linearRampToValueAtTime(0.0001, now + Math.max(0.01, TOTAL - from));
  for (const e of EVENTS) {
    const end = e.t + (e.d || 0.5);
    if (end < from || e.t > TOTAL) continue;
    const off = Math.max(0, from - e.t);
    if (off > 0 && e.k !== 'note') continue;
    scheduled.push(voice(e, now + Math.max(0, e.t - from), off));
  }
}

// ---- transport ----
let playing = true, startWall = performance.now(), offset = 0;
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play'), soundBtn = document.getElementById('sound');
scrub.max = TOTAL;
const now = () => (playing ? offset + (performance.now() - startWall) / 1000 : offset);
function seek(t) { offset = Math.max(0, Math.min(TOTAL, t)); startWall = performance.now(); if (soundOn) startSound(offset); }
function frame() {
  let t = now();
  if (t >= TOTAL) { offset = 0; startWall = performance.now(); t = 0; if (soundOn) startSound(0); }
  renderAt(t);
  scrub.value = t; timeEl.textContent = t.toFixed(1) + ' / ' + TOTAL.toFixed(1);
  requestAnimationFrame(frame);
}
playBtn.onclick = () => { if (playing) { offset = now(); playing = false; stopSound(); playBtn.textContent = '▶'; } else { playing = true; startWall = performance.now(); playBtn.textContent = '❚❚'; if (soundOn) startSound(offset); } };
soundBtn.onclick = () => { ensureAudio(); ac.resume(); soundOn = !soundOn; soundBtn.textContent = soundOn ? '🔊 소리' : '🔇 소리'; soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기'); if (soundOn) startSound(now()); else stopSound(); };
scrub.oninput = () => { offset = +scrub.value; startWall = performance.now(); if (soundOn) startSound(offset); };
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } });
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { playing = false; offset = TOTAL - 0.5; playBtn.textContent = '▶'; }
renderAt(0);
requestAnimationFrame(frame);
</script>
